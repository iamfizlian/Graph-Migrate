[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "jtet-pstmigrate"
version = "0.1.0"
description = "PST -> Microsoft 365 mailbox migration via Graph API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "JTET" }]
dependencies = [
    "msal>=1.28",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "tenacity>=8.2",
    "tomli>=2.0; python_version < '3.11'",
    "cryptography>=42.0",
    "icalendar>=5.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
pstmigrate = "jtet_pstmigrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jtet_pstmigrate"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tools/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
